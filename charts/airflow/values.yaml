# Generated from scripts/catalog_data.py. Adjust the shared metadata instead of editing this file by hand.
airflow:
  executor: CeleryExecutor
  apiServer:
    service:
      type: ClusterIP
  webserver:
    service:
      type: ClusterIP
  ingress:
    apiServer:
      enabled: false
      ingressClassName: taikun
      hosts:
      - name: airflow.local
        tls:
          enabled: true
          secretName: airflow-tls
      path: /
      tls:
        enabled: true
        secretName: airflow-tls
      annotations:
        cert-manager.io/cluster-issuer: ccf-default
        external-dns.alpha.kubernetes.io/ttl: '300'
    web:
      enabled: false
  migrateDatabaseJob:
    useHelmHooks: false
  createUserJob:
    useHelmHooks: false
  postgresql:
    enabled: true
  redis:
    enabled: true
