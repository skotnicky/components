# Generated from scripts/catalog_data.py. Adjust the shared metadata instead of editing this file by hand.
storagePermissionsFix:
  enabled: true
  image: busybox:1.36
  uid: 1001
  gid: 1001
  pluginDaemonUid: 1001
  pluginDaemonGid: 1001
  apiMountPath: /app/api/storage
  pluginMountPath: /app/storage
  fixPluginDaemon: true
  runAsRoot: true
  apiClaimName: ''
  pluginClaimName: ''
  ttlSecondsAfterFinished: 300
bundledPostgres:
  enabled: true
  image: postgres:16-alpine
  storage: 10Gi
  storageClass: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
bundledValkey:
  enabled: true
  image: valkey/valkey:8-alpine
  storage: 5Gi
  storageClass: ''
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
dify:
  global:
    edition: SELF_HOSTED
  ingress:
    enabled: false
    className: ''
    hosts:
    - host: dify.local
      paths:
      - path: /
        pathType: Prefix
    tls:
    - secretName: dify-tls
      hosts:
      - dify.local
    annotations:
      cert-manager.io/cluster-issuer: ccf-default
      external-dns.alpha.kubernetes.io/ttl: '300'
  api:
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
  worker:
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
  beat:
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
  pluginDaemon:
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
  postgresql:
    enabled: false
    image:
      registry: docker.io
      repository: postgres
      tag: 16-alpine
  redis:
    enabled: false
    image:
      registry: docker.io
      repository: redis
      tag: 7-alpine
  weaviate:
    enabled: true
  externalPostgres:
    enabled: true
    username: dify
    password: dify
    address: postgres-rw
    port: 5432
    database:
      api: dify
      pluginDaemon: dify_plugin
  externalRedis:
    enabled: true
    host: valkey
    port: 6379
    username: ''
    password: ''
