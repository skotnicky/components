# Generated from scripts/catalog_data.py.
# This file follows the common Rancher-style questions.yaml shape so catalog UIs can
# present CCF-friendly prompts.
questions:
- variable: dify.global.edition
  label: Edition
  type: enum
  default: SELF_HOSTED
  description: Dify deployment edition.
  group: Application
  required: false
  options:
  - SELF_HOSTED
  - CLOUD
- variable: dify.ingress.enabled
  label: Enable ingress
  type: boolean
  default: false
  description: Expose the Dify web console through an ingress resource.
  group: Networking
  required: false
- variable: dify.ingress.className
  label: Ingress class
  type: string
  default: taikun
  description: Optional ingressClassName used when exposing Dify through the cluster
    ingress controller. Leave blank to rely on the cluster default ingress class.
  group: Networking
  required: false
- variable: dify.ingress.hosts[0].host
  label: Ingress hostname
  type: string
  default: dify.local
  description: Primary hostname used when exposing Dify through ingress.
  group: Networking
  required: false
- variable: bundledPostgres.enabled
  label: Bundle PostgreSQL
  type: boolean
  default: true
  description: Deploy a bundled non-Bitnami PostgreSQL and publish the postgres-rw
    Service. Disable to point Dify at an external managed database.
  group: Database
  required: false
- variable: bundledPostgres.storage
  label: PostgreSQL storage size
  type: string
  default: 10Gi
  description: Persistent volume size for the bundled PostgreSQL data.
  group: Database
  required: true
- variable: dify.externalPostgres.address
  label: PostgreSQL host
  type: string
  default: postgres-rw
  description: Hostname Dify uses for PostgreSQL. Defaults to the bundled postgres-rw
    Service; set to an external host when bundledPostgres is disabled.
  group: Database
  required: true
- variable: dify.externalPostgres.username
  label: PostgreSQL user
  type: string
  default: dify
  description: Username for the PostgreSQL database. The bundled PostgreSQL is initialized
    with this user.
  group: Database
  required: true
- variable: bundledValkey.enabled
  label: Bundle Valkey
  type: boolean
  default: true
  description: Deploy a bundled non-Bitnami Valkey cache and publish the valkey Service.
    Disable to point Dify at an external Redis or Valkey.
  group: Cache
  required: false
- variable: dify.externalRedis.host
  label: Redis host
  type: string
  default: valkey
  description: Hostname Dify uses for Redis/Valkey. Defaults to the bundled valkey
    Service; set to an external host when bundledValkey is disabled.
  group: Cache
  required: true
- variable: dify.weaviate.enabled
  label: Bundle Weaviate
  type: boolean
  default: true
  description: Deploy the bundled non-Bitnami Weaviate vector store. Disable to use
    an external vector database.
  group: Application
  required: false
