# Generated from scripts/catalog_data.py.
# This file follows the common Rancher-style questions.yaml shape so catalog UIs can
# present CCF-friendly prompts.
questions:
- variable: dify.global.edition
  label: Edition
  type: enum
  default: SELF_HOSTED
  description: Dify deployment edition.
  group: Application
  required: false
  options:
  - SELF_HOSTED
  - CLOUD
- variable: dify.ingress.enabled
  label: Enable ingress
  type: boolean
  default: false
  description: Expose the Dify web console through an ingress resource.
  group: Networking
  required: false
- variable: dify.ingress.className
  label: Ingress class
  type: string
  default: taikun
  description: Optional ingressClassName used when exposing Dify through the cluster
    ingress controller. Leave blank to rely on the cluster default ingress class.
  group: Networking
  required: false
- variable: dify.ingress.hosts[0].host
  label: Ingress hostname
  type: string
  default: dify.local
  description: Primary hostname used when exposing Dify through ingress.
  group: Networking
  required: false
- variable: dify.global.consoleWebDomain
  label: Console web URL
  type: string
  default: https://dify.local
  description: Public base URL for the Dify console UI (include scheme). Set to the
    ingress host, e.g. https://dify.example.com.
  group: Public URLs
  required: true
- variable: dify.global.consoleApiDomain
  label: Console API URL
  type: string
  default: https://dify.local
  description: Public base URL for the Dify console API (include scheme).
  group: Public URLs
  required: true
- variable: dify.global.serviceApiDomain
  label: Service API URL
  type: string
  default: https://dify.local
  description: Public base URL for the Dify service API (include scheme).
  group: Public URLs
  required: true
- variable: dify.global.appWebDomain
  label: Web app URL
  type: string
  default: https://dify.local
  description: Public base URL for published Dify web apps (include scheme).
  group: Public URLs
  required: true
- variable: dify.global.appApiDomain
  label: Web app API URL
  type: string
  default: https://dify.local
  description: Public base URL used by web apps to reach the API (include scheme).
  group: Public URLs
  required: true
- variable: dify.global.filesDomain
  label: Files URL
  type: string
  default: https://dify.local
  description: Public base URL for file preview/download links (include scheme).
  group: Public URLs
  required: true
- variable: dify.global.triggerDomain
  label: Trigger URL
  type: string
  default: https://dify.local
  description: Public base URL for trigger endpoints (include scheme).
  group: Public URLs
  required: true
- variable: bundledPostgres.enabled
  label: Bundle PostgreSQL
  type: boolean
  default: true
  description: Deploy a bundled non-Bitnami PostgreSQL and publish the postgres-rw
    Service. Disable to point Dify at an external managed database.
  group: Database
  required: false
- variable: bundledPostgres.storage
  label: PostgreSQL storage size
  type: string
  default: 10Gi
  description: Persistent volume size for the bundled PostgreSQL data.
  group: Database
  required: true
- variable: dify.externalPostgres.address
  label: PostgreSQL host
  type: string
  default: postgres-rw
  description: Hostname Dify uses for PostgreSQL. Defaults to the bundled postgres-rw
    Service; set to an external host when bundledPostgres is disabled.
  group: Database
  required: true
- variable: dify.externalPostgres.username
  label: PostgreSQL user
  type: string
  default: dify
  description: Username for the PostgreSQL database. The bundled PostgreSQL is initialized
    with this user.
  group: Database
  required: true
- variable: bundledValkey.enabled
  label: Bundle Valkey
  type: boolean
  default: true
  description: Deploy a bundled non-Bitnami Valkey cache and publish the valkey Service.
    Disable to point Dify at an external Redis or Valkey.
  group: Cache
  required: false
- variable: dify.externalRedis.host
  label: Redis host
  type: string
  default: valkey
  description: Hostname Dify uses for Redis/Valkey. Defaults to the bundled valkey
    Service; set to an external host when bundledValkey is disabled.
  group: Cache
  required: true
- variable: dify.weaviate.enabled
  label: Bundle Weaviate
  type: boolean
  default: true
  description: Deploy the bundled non-Bitnami Weaviate vector store. Disable to use
    an external vector database.
  group: Application
  required: false
- variable: dify.api.persistence.persistentVolumeClaim.storageClass
  label: Shared storage class (API)
  type: string
  default: ''
  description: Storage class for the shared RWX API data volume. Leave blank for the
    cluster default, but on multi-node clusters set a true shared filesystem class
    (for example shared-fs or manila-csi); block-storage classes can deadlock RWX
    claims.
  group: Storage
  required: false
- variable: dify.pluginDaemon.persistence.persistentVolumeClaim.storageClass
  label: Shared storage class (plugin daemon)
  type: string
  default: ''
  description: Storage class for the shared RWX plugin-daemon data volume. Use the
    same shared filesystem class as the API volume on multi-node clusters.
  group: Storage
  required: false
