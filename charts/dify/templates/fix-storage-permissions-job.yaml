{{- if .Values.storagePermissionsFix.enabled }}
{{- $fix := .Values.storagePermissionsFix }}
{{- /*
Each shared Dify PVC is fixed by its own Job that mounts only that single claim.
On clusters where the RWX class is effectively single-attach (for example OpenStack
block-storage), the api and plugin-daemon volumes can be attached to different nodes;
a single helper pod mounting both would deadlock. Per-claim Jobs schedule independently
onto whichever node can attach their volume.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-fix-storage-perms-api
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage-permissions-fix
spec:
  ttlSecondsAfterFinished: {{ $fix.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: storage-permissions-fix
    spec:
      restartPolicy: Never
      {{- if $fix.runAsRoot }}
      initContainers:
        - name: open-storage-perms
          image: {{ $fix.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              API_DIR="{{ $fix.apiMountPath }}"
              mkdir -p "${API_DIR}/privkeys"
              chown -R {{ $fix.uid }}:{{ $fix.gid }} "${API_DIR}" || true
              chmod -R a+rwX "${API_DIR}"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: api-data
              mountPath: {{ $fix.apiMountPath }}
      {{- end }}
      containers:
        - name: verify-storage-write
          image: {{ $fix.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              API_DIR="{{ $fix.apiMountPath }}"
              mkdir -p "${API_DIR}/privkeys/.ccf-write-test"
              touch "${API_DIR}/privkeys/.ccf-write-test/private.pem"
              echo "storage permissions OK for uid $(id -u)"
          securityContext:
            runAsUser: {{ $fix.uid }}
            runAsGroup: {{ $fix.gid }}
          volumeMounts:
            - name: api-data
              mountPath: {{ $fix.apiMountPath }}
      securityContext:
        fsGroup: {{ $fix.gid }}
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: {{ include "ccf-dify.storagePermissionsFix.apiClaimName" . }}
{{- if $fix.fixPluginDaemon }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-fix-storage-perms-plugin
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage-permissions-fix
spec:
  ttlSecondsAfterFinished: {{ $fix.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: storage-permissions-fix
    spec:
      restartPolicy: Never
      {{- if $fix.runAsRoot }}
      initContainers:
        - name: open-storage-perms
          image: {{ $fix.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              PLUGIN_DIR="{{ $fix.pluginMountPath }}"
              mkdir -p "${PLUGIN_DIR}"
              chown -R {{ $fix.pluginDaemonUid }}:{{ $fix.pluginDaemonGid }} "${PLUGIN_DIR}" || true
              chmod -R a+rwX "${PLUGIN_DIR}"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: plugin-data
              mountPath: {{ $fix.pluginMountPath }}
      {{- end }}
      containers:
        - name: verify-storage-write
          image: {{ $fix.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              PLUGIN_DIR="{{ $fix.pluginMountPath }}"
              mkdir -p "${PLUGIN_DIR}/.ccf-write-test"
              touch "${PLUGIN_DIR}/.ccf-write-test/write.ok"
              echo "plugin storage permissions OK for uid $(id -u)"
          securityContext:
            runAsUser: {{ $fix.pluginDaemonUid }}
            runAsGroup: {{ $fix.pluginDaemonGid }}
          volumeMounts:
            - name: plugin-data
              mountPath: {{ $fix.pluginMountPath }}
      securityContext:
        fsGroup: {{ $fix.pluginDaemonGid }}
      volumes:
        - name: plugin-data
          persistentVolumeClaim:
            claimName: {{ include "ccf-dify.storagePermissionsFix.pluginClaimName" . }}
{{- end }}
{{- end }}
