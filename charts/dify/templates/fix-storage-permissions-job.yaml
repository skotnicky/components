{{- if .Values.storagePermissionsFix.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-fix-storage-perms
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage-permissions-fix
spec:
  ttlSecondsAfterFinished: {{ .Values.storagePermissionsFix.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: storage-permissions-fix
    spec:
      restartPolicy: Never
      {{- if .Values.storagePermissionsFix.runAsRoot }}
      initContainers:
        - name: open-storage-perms
          image: {{ .Values.storagePermissionsFix.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              API_DIR="{{ .Values.storagePermissionsFix.apiMountPath }}"
              mkdir -p "${API_DIR}/privkeys"
              chown -R {{ .Values.storagePermissionsFix.uid }}:{{ .Values.storagePermissionsFix.gid }} "${API_DIR}" || true
              chmod -R a+rwX "${API_DIR}"
              {{- if .Values.storagePermissionsFix.fixPluginDaemon }}
              PLUGIN_DIR="{{ .Values.storagePermissionsFix.pluginMountPath }}"
              mkdir -p "${PLUGIN_DIR}"
              chown -R {{ .Values.storagePermissionsFix.pluginDaemonUid }}:{{ .Values.storagePermissionsFix.pluginDaemonGid }} "${PLUGIN_DIR}" || true
              chmod -R a+rwX "${PLUGIN_DIR}"
              {{- end }}
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: api-data
              mountPath: {{ .Values.storagePermissionsFix.apiMountPath }}
            {{- if .Values.storagePermissionsFix.fixPluginDaemon }}
            - name: plugin-data
              mountPath: {{ .Values.storagePermissionsFix.pluginMountPath }}
            {{- end }}
      {{- end }}
      containers:
        - name: verify-storage-write
          image: {{ .Values.storagePermissionsFix.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              API_DIR="{{ .Values.storagePermissionsFix.apiMountPath }}"
              mkdir -p "${API_DIR}/privkeys/.ccf-write-test"
              touch "${API_DIR}/privkeys/.ccf-write-test/private.pem"
              echo "storage permissions OK for uid $(id -u)"
          securityContext:
            runAsUser: {{ .Values.storagePermissionsFix.uid }}
            runAsGroup: {{ .Values.storagePermissionsFix.gid }}
          volumeMounts:
            - name: api-data
              mountPath: {{ .Values.storagePermissionsFix.apiMountPath }}
      securityContext:
        fsGroup: {{ .Values.storagePermissionsFix.gid }}
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: {{ include "ccf-dify.storagePermissionsFix.apiClaimName" . }}
        {{- if .Values.storagePermissionsFix.fixPluginDaemon }}
        - name: plugin-data
          persistentVolumeClaim:
            claimName: {{ include "ccf-dify.storagePermissionsFix.pluginClaimName" . }}
        {{- end }}
{{- end }}
